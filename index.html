<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .container {
      width: 85%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      max-width: 140px;
      max-height: 140px;
      margin-bottom: 2.5rem;
      object-fit: contain;
    }
    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      padding: 4rem 3rem;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    h2 {
      font-size: 2.2rem;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
    }
    h1 {
      font-size: 4rem;
      color: #38bdf8;
      font-weight: 700;
      line-height: 1.3;
      word-wrap: break-word;
    }
    .standby-msg {
      font-size: 2.2rem;
      color: #64748b;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.jpg" alt="Logo" class="logo" id="site-logo" onerror="this.style.display='none';">

    <div class="card" id="welcome-card" style="display: none;">
      <h2>Bienvenue dans nos locaux</h2>
      <h1 id="company-names">---</h1>
    </div>
    
    <div id="standby-card" style="display: block;">
      <p class="standby-msg">Bienvenue</p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweZ9OmSVqYC3b9Ee9dIwjKNL7V-hUqu9ynCVodBSC0KZH7zHc2DwviqGpxOmgq2tG_/exec";

    async function fetchCompany() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        const namesElem = document.getElementById("company-names");
        const welcomeCard = document.getElementById("welcome-card");
        const standbyCard = document.getElementById("standby-card");
        
        if (data && data.companies && data.companies.length > 0) {
          // Joint les noms des sociétés s'il y en a plusieurs en même temps
          namesElem.innerText = data.companies.join(" & ");
          welcomeCard.style.display = "block";
          standbyCard.style.display = "none";
        } else {
          welcomeCard.style.display = "none";
          standbyCard.style.display = "block";
        }
      } catch (err) {
        console.error("Erreur de récupération :", err);
      }
    }

    fetchCompany();
    setInterval(fetchCompany, 30000); // Actualisation toutes les 30 secondes
  </script>
</body>
</html>
