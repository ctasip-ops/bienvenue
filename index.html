<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow-y: auto;
      padding: 2rem 0;
      cursor: pointer; /* Indique qu'on peut cliquer n'importe où pour passer en plein écran */
    }
    .container {
      width: 85%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .logo {
      max-width: 140px;
      max-height: 140px;
      object-fit: contain;
    }
    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      padding: 3rem 2rem;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    h2 {
      font-size: 2rem;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 4px;
    }
    h1 {
      font-size: 3.5rem;
      color: #38bdf8;
      font-weight: 700;
      line-height: 1.2;
      word-wrap: break-word;
    }
    .standby-msg {
      font-size: 2.2rem;
      color: #64748b;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.jpg" alt="Logo" class="logo" id="site-logo" onerror="this.style.display='none';">

    <!-- Zone dynamique d'affichage des encadrés -->
    <div id="cards-container" style="width: 100%; display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="card" id="standby-card">
        <p class="standby-msg">Bienvenue</p>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweZ9OmSVqYC3b9Ee9dIwjKNL7V-hUqu9ynCVodBSC0KZH7zHc2DwviqGpxOmgq2tG_/exec";

    // --- Fonction Plein Écran ---
    function enableFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Plein écran non disponible :", err.message);
        });
      }
    }

    // Active le plein écran au premier clic / touché sur l'écran de la tablette
    document.addEventListener("click", enableFullScreen);
    document.addEventListener("touchstart", enableFullScreen);

    // --- Récupération des événements ---
    async function fetchCompany() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        const container = document.getElementById("cards-container");
        container.innerHTML = ""; // Nettoie le contenu précédent
        
        if (data && data.companies && data.companies.length > 0) {
          // Génère un encadré distinct par événement/visiteur en cours
          data.companies.forEach(companyName => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <h2>Bienvenue dans nos locaux</h2>
              <h1>${companyName}</h1>
            `;
            container.appendChild(card);
          });
        } else {
          // Affichage du mode veille si aucun événement
          const standbyCard = document.createElement("div");
          standbyCard.className = "card";
          standbyCard.innerHTML = `<p class="standby-msg">Bienvenue</p>`;
          container.appendChild(standbyCard);
        }
      } catch (err) {
        console.error("Erreur de récupération :", err);
      }
    }

    fetchCompany();
    setInterval(fetchCompany, 30000); // Actualisation toutes les 30 secondes
  </script>
</body>
</html>
